[package]
name = "toy-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
crossterm = "0.28"
unicode-width = "0.2"
ratatui = "0.29"
pulldown-cmark = "0.12"
libc = "0.2"
